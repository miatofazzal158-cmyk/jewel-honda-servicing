name: Build Jewel Honda APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          unzip -q Jewel_Honda_Android_GitHub_Build.zip
          cd jewel_honda_android
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jewel-Honda-Servicing-APK
          path: jewel_honda_android/android/app/build/outputs/apk/debug/app-debug.apk
